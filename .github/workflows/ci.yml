name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/ --ignore=tests/blender_integration_test.py -v

  blender-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender-series: "4.2"
            blender-version: "4.2.23"
          - blender-series: "5.0"
            blender-version: "5.0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set Blender path
        run: echo "BLENDER_DIR=$RUNNER_TEMP/blender-${{ matrix.blender-version }}" >> "$GITHUB_ENV"

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-${{ matrix.blender-version }}-linux-x64

      - name: Download Blender ${{ matrix.blender-version }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BLENDER_DIR"
          curl -fsSL "https://download.blender.org/release/Blender${{ matrix.blender-series }}/blender-${{ matrix.blender-version }}-linux-x64.tar.xz" \
            | tar -xJ --strip-components=1 -C "$BLENDER_DIR"

      - name: Install Blender runtime libraries
        run: |
          # Headless Blender still needs EGL/GL and a few X11 client libraries
          if ! ldconfig -p | grep -q 'libEGL.so.1'; then
            SUDO=$([ "$(id -u)" -eq 0 ] && echo "" || echo "sudo")
            $SUDO apt-get update -q
            $SUDO apt-get install -y -q --no-install-recommends \
              libegl1 libgl1 libxkbcommon0 libsm6 libxi6 libxrender1 libxxf86vm1 libxfixes3
          fi
          "$BLENDER_DIR/blender" --version

      - name: Run Blender integration tests
        run: |
          "$BLENDER_DIR/blender" --background --factory-startup --python-exit-code 1 \
            --python tests/blender_integration_test.py

      - name: Run Blender compat tests
        run: |
          "$BLENDER_DIR/blender" --background --factory-startup --python-exit-code 1 \
            --python tests/test_compat.py

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, blender-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Build addon ZIP
        run: python scripts/package_addon.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
